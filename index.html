<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="styles.css">
<style>
*{
margin:0;
padding:0;
}
html,body{

}

#sort{
}

}

  <option value="merge_sort">MERGE SORT</option>
  <option value="heap_sort">HEAP SORT</option>
